# Main is the integration/testing branch. A successful push also produces
# an installable package; pull requests run the same checks without publishing.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Check packaging and locale generation
        run: |
          python3 -m unittest discover -s Dev/ci -p 'test_*.py'
          luajit Dev/Locale/extract.lua --check

      - name: Run every registered test in a fresh process
        run: bash Dev/ci/test.sh

      - name: Stamp the main testing build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 Dev/ci/package.py prepare main

      - name: Package the main testing build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2
        with:
          args: -d -p 0 -w 0 -a 0 -n "{package-name}-main-{project-abbreviated-hash}"

      - name: Verify the installable ZIP and write checksums
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 Dev/ci/package.py verify main

      - name: Upload the main testing build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: social_diary-main-${{ github.sha }}
          path: |
            .release/*.zip
            .release/SHA256SUMS
            .release/BUILD-INFO.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Link the testing build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          {
            printf '### Main testing build\n\n'
            printf 'Download the artifact below, then extract its addon ZIP into `Interface/AddOns`.\n\n'
            printf 'Source commit: `%s`. Automated checks passed; live-client testing is still needed.\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
